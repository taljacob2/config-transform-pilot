name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    env:
      # Job-level, not step-level -- see build-transformed.yml for why: dotnet
      # build's implicit restore enumerates every source in nuget.config even
      # for a project with no dependency on this feed, so %CONFIGTRANSFORM_PACKAGES_SOURCE%
      # must be expandable on every step here, not just one. This workflow never
      # needed secrets before nuget.config referenced this variable -- it does now,
      # since restore touches nuget.config regardless of which workflow runs it.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CONFIGTRANSFORM_PACKAGES_SOURCE: ${{ vars.CONFIGTRANSFORM_PACKAGES_SOURCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - run: dotnet restore OrderProcessor.Framework/OrderProcessor.Framework.csproj
      - run: dotnet build OrderProcessor.Framework/OrderProcessor.Framework.csproj --no-restore --configuration Release

      - run: dotnet restore Web/AdminPortal.Web/AdminPortal.Web.csproj
      - run: dotnet build Web/AdminPortal.Web/AdminPortal.Web.csproj --no-restore --configuration Release

      - run: dotnet restore apps/billing/BillingApi.Core/BillingApi.Core.csproj
      - run: dotnet build apps/billing/BillingApi.Core/BillingApi.Core.csproj --no-restore --configuration Release

      - run: dotnet restore legacy/LegacyGateway.Framework/LegacyGateway.Framework.csproj
      - run: dotnet build legacy/LegacyGateway.Framework/LegacyGateway.Framework.csproj --no-restore --configuration Release
