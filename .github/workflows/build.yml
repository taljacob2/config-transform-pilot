name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x

      - run: dotnet restore OrderProcessor.Framework/OrderProcessor.Framework.csproj
      - run: dotnet build OrderProcessor.Framework/OrderProcessor.Framework.csproj --no-restore --configuration Release

      - run: dotnet restore Web/AdminPortal.Web/AdminPortal.Web.csproj
      - run: dotnet build Web/AdminPortal.Web/AdminPortal.Web.csproj --no-restore --configuration Release

      - run: dotnet restore apps/billing/BillingApi.Core/BillingApi.Core.csproj
      - run: dotnet build apps/billing/BillingApi.Core/BillingApi.Core.csproj --no-restore --configuration Release
