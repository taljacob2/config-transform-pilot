name: build-transformed

on:
  workflow_dispatch:
    inputs:
      client:
        description: "Client name"
        required: true
        type: choice
        options:
          - Acme
          - Globex
          - Initech
      environment:
        description: "Environment name"
        required: true
        type: choice
        options:
          - Staging
          - Production
      host:
        description: "Host name (optional -- a specific load-balanced server; only Clients/Acme/Production has any today)"
        required: false
        type: choice
        default: ""
        options:
          - ""
          - "10.0.1.11"
          - "10.0.1.12"

jobs:
  transform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      # Job-level, not step-level: dotnet build's implicit restore for ANY project
      # enumerates every source in nuget.config, even one none of these projects
      # actually depend on -- so the %CONFIGTRANSFORM_PACKAGES_SOURCE% expansion has
      # to be available on every step that runs `dotnet build`/`dotnet restore`, not
      # just the one that runs `dotnet tool restore`. Learned the hard way: scoping
      # this to a single step's `env:` left it unexpanded on every later step, which
      # NuGet then treated as a literal (nonexistent) local path -- NU1301, not an
      # auth failure, since the source value itself is evaluated unconditionally on
      # every invocation while credentials are only checked lazily on actual pull.
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
      CONFIGTRANSFORM_PACKAGES_SOURCE: ${{ vars.CONFIGTRANSFORM_PACKAGES_SOURCE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install git-crypt
        run: sudo apt-get update && sudo apt-get install -y git-crypt

      - name: Unlock git-crypt
        run: |
          echo "${{ secrets.GIT_CRYPT_KEY_BASE64 }}" | base64 -d > /tmp/git-crypt-key
          git-crypt unlock /tmp/git-crypt-key
          rm /tmp/git-crypt-key

      - name: Restore local tools
        run: dotnet tool restore

      - run: dotnet build OrderProcessor.Framework/OrderProcessor.Framework.csproj --configuration Release --output publish/OrderProcessor.Framework
      - run: dotnet build Web/AdminPortal.Web/AdminPortal.Web.csproj --configuration Release --output publish/AdminPortal.Web
      - run: dotnet build apps/billing/BillingApi.Core/BillingApi.Core.csproj --configuration Release --output publish/BillingApi.Core
      - run: dotnet build legacy/LegacyGateway.Framework/LegacyGateway.Framework.csproj --configuration Release --output publish/LegacyGateway.Framework

      - name: Resolve OrderProcessor.Framework/App.config
        run: |
          dotnet tool run configtransform -- \
            --resource OrderProcessor.Framework/App.config \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/OrderProcessor.Framework/OrderProcessor.Framework.exe.config

      - name: Resolve Web/AdminPortal.Web/Web.config
        run: |
          dotnet tool run configtransform -- \
            --resource Web/AdminPortal.Web/Web.config \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/AdminPortal.Web/Web.config

      - name: Resolve Web/AdminPortal.Web/Web.config for one specific host (config-transform 0.19.0-alpha)
        # --host is a third, optional layer axis (docs/HOST_LAYER_DESIGN.md in config-transform) for
        # load-balanced servers that need genuinely different config from each other, not just from
        # other clients/environments -- here, which cache node this box talks to. Only
        # Clients/Acme/Production has any Hosts/ layers today (10.0.1.11, 10.0.1.12), so this step is
        # skipped for every other client/environment/host combination rather than failing loudly --
        # the same "missing overlay ≠ error" tolerance every other layer in this pilot already has.
        if: inputs.host != ''
        run: |
          mkdir -p publish/AdminPortal.Web-Host
          dotnet tool run configtransform -- \
            --resource Web/AdminPortal.Web/Web.config \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" --host "${{ inputs.host }}" \
            --output publish/AdminPortal.Web-Host/Web.config
          python3 -c "import xml.etree.ElementTree as ET; ET.parse(open('publish/AdminPortal.Web-Host/Web.config', encoding='utf-8-sig'))"
          echo "::group::AdminPortal.Web/Web.config (host ${{ inputs.host }})"
          cat publish/AdminPortal.Web-Host/Web.config
          echo "::endgroup::"
          echo "::group::--list for host ${{ inputs.host }} (full base->Environment->Client->Host chain)"
          dotnet tool run configtransform -- \
            --list --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" --host "${{ inputs.host }}"
          echo "::endgroup::"

      - name: Resolve apps/billing/BillingApi.Core/appsettings.json
        run: |
          dotnet tool run configtransform -- \
            --resource apps/billing/BillingApi.Core/appsettings.json \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/BillingApi.Core/appsettings.json

      - name: Resolve legacy/LegacyGateway.Framework/App.config (net35 project -- proves the tool has no TargetFramework coupling)
        run: |
          dotnet tool run configtransform -- \
            --resource legacy/LegacyGateway.Framework/App.config \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/LegacyGateway.Framework/LegacyGateway.Framework.exe.config

      - name: Resolve services/notifications/NotificationWorker/.env (Node.js project -- proves the tool has no .NET/ecosystem coupling at all, not just no TargetFramework coupling)
        run: |
          mkdir -p publish/NotificationWorker
          dotnet tool run configtransform -- \
            --resource services/notifications/NotificationWorker/.env \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/NotificationWorker/.env

      - name: Resolve services/reporting/ReportingService/config.yaml (Python project -- a third ecosystem, proving the tool's no-coupling claim isn't specific to .NET or Node.js)
        run: |
          mkdir -p publish/ReportingService
          dotnet tool run configtransform -- \
            --resource services/reporting/ReportingService/config.yaml \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish/ReportingService/config.yaml

      - name: Install PyYAML (for the YAML validation step below only -- ReportingService itself is never built or run)
        run: pip install --quiet pyyaml

      - name: Validate merged output is well-formed
        run: |
          python3 -c "import xml.etree.ElementTree as ET; ET.parse(open('publish/OrderProcessor.Framework/OrderProcessor.Framework.exe.config', encoding='utf-8-sig'))"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse(open('publish/AdminPortal.Web/Web.config', encoding='utf-8-sig'))"
          python3 -c "import json; json.load(open('publish/BillingApi.Core/appsettings.json'))"
          python3 -c "import xml.etree.ElementTree as ET; ET.parse(open('publish/LegacyGateway.Framework/LegacyGateway.Framework.exe.config', encoding='utf-8-sig'))"
          python3 -c "
          for line in open('publish/NotificationWorker/.env'):
              line = line.strip()
              assert line and '=' in line, f'malformed .env line: {line!r}'
          "
          python3 -c "import yaml; yaml.safe_load(open('publish/ReportingService/config.yaml'))"

      - name: Show resolved config (this pilot has no real secrets, so this is safe)
        run: |
          echo "::group::OrderProcessor.Framework/App.config"
          cat publish/OrderProcessor.Framework/OrderProcessor.Framework.exe.config
          echo "::endgroup::"
          echo "::group::AdminPortal.Web/Web.config"
          cat publish/AdminPortal.Web/Web.config
          echo "::endgroup::"
          echo "::group::BillingApi.Core/appsettings.json"
          cat publish/BillingApi.Core/appsettings.json
          echo "::endgroup::"
          echo "::group::LegacyGateway.Framework/App.config (net35)"
          cat publish/LegacyGateway.Framework/LegacyGateway.Framework.exe.config
          echo "::endgroup::"
          echo "::group::NotificationWorker/.env (Node.js)"
          cat publish/NotificationWorker/.env
          echo "::endgroup::"
          echo "::group::ReportingService/config.yaml (Python)"
          cat publish/ReportingService/config.yaml
          echo "::endgroup::"

      - name: Show the resolved layer chain (--list)
        run: |
          dotnet tool run configtransform -- \
            --list --client "${{ inputs.client }}" --environment "${{ inputs.environment }}"

      - name: Show which layer changed which line (--diff-layers, config-transform 0.22.0-alpha)
        # Web/AdminPortal.Web/Web.config is patched at both Environments/<E> and (for Acme/Production)
        # Clients/Acme/Production -- a real multi-layer chain, not a synthetic fixture, to exercise
        # docs/DIFF_LAYERS_DESIGN.md's per-layer diff attribution against.
        run: |
          dotnet tool run configtransform -- \
            --resource Web/AdminPortal.Web/Web.config \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --diff-layers

      - name: Demonstrate multi-resource mode (--resource omitted, --output as a directory)
        # Not the deploy path -- .NET Framework needs <AssemblyName>.exe.config next to the exe,
        # and this mode mirrors each resource's own repo-root-relative path under --output instead.
        # Kept as a real exercise of the unified CLI's headline capability (config-transform
        # 0.8.0-alpha): one call resolves every resource the layer touches -- XML, JSON, .env
        # (since 0.15.0-alpha), and YAML (since 0.16.0-alpha) together, no per-format invocation,
        # no stderr skip note (see FINDINGS.md's "Migrating to the unified CLI" section). Its
        # output also makes a real property visible: it emits only what the resolved layer CHAIN
        # lists, so legacy/LegacyGateway.Framework/App.config is absent for every Staging dispatch
        # (no layer in the Staging chain names it) while the explicit --resource step above still
        # resolves it to base-only. services/notifications/NotificationWorker/.env and
        # services/reporting/ReportingService/config.yaml are each listed in BOTH Environment
        # layers (Production and Staging), so both are present for every client/environment
        # combination -- base-only where no client layer overrides them, patched where one does
        # (Acme/Production for both, as of this repo's newest project).
        run: |
          dotnet tool run configtransform -- \
            --client "${{ inputs.client }}" --environment "${{ inputs.environment }}" \
            --output publish-all/
          echo "Resources emitted by multi-resource mode:"
          find publish-all -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: resolved-config-${{ inputs.client }}-${{ inputs.environment }}
          path: |
            publish/OrderProcessor.Framework/OrderProcessor.Framework.exe.config
            publish/AdminPortal.Web/Web.config
            publish/AdminPortal.Web-Host/Web.config
            publish/BillingApi.Core/appsettings.json
            publish/LegacyGateway.Framework/LegacyGateway.Framework.exe.config
            publish/NotificationWorker/.env
            publish/ReportingService/config.yaml
            publish-all/**
          if-no-files-found: warn
